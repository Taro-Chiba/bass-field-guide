<title>バス釣り現場ガイド</title>
<style>
:root{
  --bg:#EDF2F0; --surface:#FFFFFF; --ink:#152825; --ink-soft:#4A615C; --line:#D3DEDA;
  --teal:#0F3D36; --teal-soft:#E1ECE9; --accent:#E4572E; --accent-ink:#FFFFFF;
  --chip-bg:#FFFFFF; --chip-on:#0F3D36; --chip-on-ink:#F2F7F5;
  --bar-bg:#DCE6E2; --good:#2E7D5B;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0C1514; --surface:#152220; --ink:#E4ECE9; --ink-soft:#93A8A2; --line:#253733;
    --teal:#8FC7BB; --teal-soft:#1B2E2A; --accent:#F0663C; --accent-ink:#160B07;
    --chip-bg:#152220; --chip-on:#8FC7BB; --chip-on-ink:#0C1514;
    --bar-bg:#22332F; --good:#5BBE8F;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1514; --surface:#152220; --ink:#E4ECE9; --ink-soft:#93A8A2; --line:#253733;
  --teal:#8FC7BB; --teal-soft:#1B2E2A; --accent:#F0663C; --accent-ink:#160B07;
  --chip-bg:#152220; --chip-on:#8FC7BB; --chip-on-ink:#0C1514;
  --bar-bg:#22332F; --good:#5BBE8F;
}
:root[data-theme="light"]{
  --bg:#EDF2F0; --surface:#FFFFFF; --ink:#152825; --ink-soft:#4A615C; --line:#D3DEDA;
  --teal:#0F3D36; --teal-soft:#E1ECE9; --accent:#E4572E; --accent-ink:#FFFFFF;
  --chip-bg:#FFFFFF; --chip-on:#0F3D36; --chip-on-ink:#F2F7F5;
  --bar-bg:#DCE6E2; --good:#2E7D5B;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;
  font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 90px}
header{padding:18px 2px 10px;display:flex;align-items:baseline;justify-content:space-between}
header h1{font-size:19px;margin:0;letter-spacing:.02em}
header h1 small{color:var(--ink-soft);font-weight:normal;font-size:12px;margin-left:8px}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:8px;padding:8px 0 12px;background:var(--bg)}
.tabs button{flex:1;padding:11px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface);
  color:var(--ink-soft);font-size:15px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--teal);border-color:var(--teal);color:var(--chip-on-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 16px;margin-bottom:12px}
.lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--ink-soft);
  text-transform:uppercase;margin:14px 0 6px}
.lbl:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:var(--chip-bg);
  color:var(--ink);font-size:14px;cursor:pointer;min-height:40px}
.chips button.on{background:var(--chip-on);border-color:var(--chip-on);color:var(--chip-on-ink);font-weight:700}
.row{display:flex;gap:10px;align-items:center}
input[type=number],input[type=text],select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--chip-bg);color:var(--ink);font-size:15px;width:100%;font-variant-numeric:tabular-nums}
.hint{font-size:12.5px;color:var(--ink-soft);margin-top:4px}
.go{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,var(--bg) 40%);z-index:6}
.go button{display:block;width:100%;max-width:560px;margin:0 auto;padding:15px 0;border:none;border-radius:12px;
  background:var(--accent);color:var(--accent-ink);font-size:17px;font-weight:800;letter-spacing:.06em;cursor:pointer}
.strategy{background:var(--teal-soft);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:12px}
.strategy b{color:var(--teal)}
.wx{background:var(--teal-soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13px}
.wx .ttl{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wx .ttl b{font-size:13.5px}
.wx .ttl button{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
  border-radius:8px;padding:4px 10px;font-size:12.5px;cursor:pointer;flex:none}
.wx .data{margin-top:4px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.wx.err .data{color:var(--accent)}
.rec{border-left:4px solid var(--accent)}
.rec .head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.rec .rank{background:var(--accent);color:var(--accent-ink);font-weight:800;border-radius:8px;
  padding:2px 9px;font-size:13px;flex:none}
.rec .name{font-size:16.5px;font-weight:800}
.rec .cat{font-size:12px;color:var(--ink-soft)}
.fit{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.fit .bar{flex:1;height:6px;border-radius:3px;background:var(--bar-bg);overflow:hidden}
.fit .bar i{display:block;height:100%;background:var(--good);border-radius:3px}
.fit span{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:66px 1fr;gap:6px 10px;font-size:14px}
.kv dt{color:var(--ink-soft);font-weight:700;font-size:12.5px;padding-top:1px}
.kv dd{margin:0}
.reason{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);font-size:13px;color:var(--ink-soft)}
.tacklehint{margin-top:7px;font-size:13px;color:var(--teal);font-weight:600}
.copybtn{margin-top:4px;width:100%;padding:11px 0;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);color:var(--ink-soft);font-size:14px;cursor:pointer}
.lure-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.lure-item:last-child{border-bottom:none}
.lure-item .nm{font-weight:600}
.lure-item .meta{font-size:12px;color:var(--ink-soft)}
.lure-item button{border:none;background:none;color:var(--accent);font-size:13px;cursor:pointer;padding:6px}
.addform{display:grid;gap:8px;margin-top:10px}
.addform .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn2{padding:11px 0;border:none;border-radius:10px;background:var(--teal);color:var(--chip-on-ink);
  font-size:15px;font-weight:700;cursor:pointer}
.btn3{padding:10px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface);
  color:var(--ink);font-size:14px;font-weight:600;cursor:pointer}
.subtle{font-size:12.5px;color:var(--ink-soft)}
.groupttl{font-size:13px;font-weight:800;color:var(--teal);margin:14px 0 2px}
.empty{padding:20px;text-align:center;color:var(--ink-soft)}
#results{scroll-margin-top:70px}
</style>

<div class="wrap">
<header><h1>バス釣り現場ガイド<small>Field Bass Guide</small></h1></header>

<nav class="tabs">
  <button id="tabGuide" class="on" onclick="showTab('guide')">ガイド</button>
  <button id="tabTackle" onclick="showTab('tackle')">タックル</button>
</nav>

<!-- ================= GUIDE ================= -->
<section id="pageGuide">
  <div class="card">
    <span class="lbl">フィールド</span>
    <div class="chips" id="cFieldSel"></div>
    <div id="genericField" style="display:none">
      <span class="lbl">フィールドタイプ</span>
      <div class="chips" id="cFieldType"></div>
    </div>
    <div class="wx" id="wxBar">
      <div class="ttl"><b id="wxTitle">現地の状況</b><button onclick="fetchWx(true)">再取得</button></div>
      <div class="data" id="wxData">取得中…</div>
    </div>
  </div>
  <div class="card">
    <span class="lbl">月</span>
    <div class="chips" id="cMonth"></div>
    <span class="lbl">時間帯</span>
    <div class="chips" id="cTime"></div>
    <span class="lbl">天気</span>
    <div class="chips" id="cSky"></div>
    <span class="lbl">風</span>
    <div class="chips" id="cWind"></div>
    <span class="lbl">水温(わかれば)</span>
    <div class="row">
      <input type="number" id="inTemp" inputmode="decimal" placeholder="未入力なら自動推定" style="max-width:200px"> <span>℃</span>
    </div>
    <span class="lbl">水質</span>
    <div class="chips" id="cClarity"></div>
    <span class="lbl">目の前のポイント</span>
    <div class="chips" id="cCover"></div>
    <span class="lbl">狙う水深</span>
    <div class="chips" id="cDepth"></div>
    <p class="hint">※月・時間帯・天気・風は自動入力されます。実際と違う場合はタップで直してください。</p>
  </div>
  <div id="results"></div>
</section>

<!-- ================= TACKLE ================= -->
<section id="pageTackle" style="display:none">
  <div class="card">
    <span class="lbl">フィールド管理</span>
    <div id="fieldList"></div>
    <div class="addform">
      <input type="text" id="fFieldName" placeholder="フィールド名(例: 近所の野池)">
      <div class="row2">
        <select id="fFieldType">
          <option value="pond">野池</option>
          <option value="lake" selected>湖・ダム</option>
          <option value="river">川</option>
        </select>
        <button class="btn3" onclick="gpsFill()">📍 現在地を入れる</button>
      </div>
      <div class="row2">
        <input type="number" id="fFieldLat" inputmode="decimal" placeholder="緯度(天気取得に使用)">
        <input type="number" id="fFieldLon" inputmode="decimal" placeholder="経度">
      </div>
      <button class="btn2" onclick="addField()">フィールドを追加</button>
      <p class="hint">緯度・経度が空でも登録できます(その場合、天気の自動取得は無効)。</p>
    </div>
  </div>
  <div class="card">
    <span class="lbl">ルアーボックス</span>
    <p class="subtle" id="sampleNote">※現在はサンプルデータです。自分の手持ちに入れ替えてください。</p>
    <div id="lureList"></div>
    <div class="addform">
      <input type="text" id="fLureName" placeholder="ルアー名(例: OSP ドライブスティック 4.5)">
      <div class="row2">
        <select id="fLureCat"></select>
        <select id="fLureColor">
          <option value="natural">ナチュラル系カラー</option>
          <option value="appeal">アピール系カラー</option>
          <option value="dark">ブラック/ダーク系</option>
        </select>
      </div>
      <button class="btn2" onclick="addLure()">ルアーを追加</button>
    </div>
  </div>
  <div class="card">
    <span class="lbl">ロッド</span>
    <div id="rodList"></div>
    <div class="addform">
      <input type="text" id="fRodName" placeholder="ロッド名(例: ポイズンアドレナ 264UL)">
      <div class="row2">
        <select id="fRodType">
          <option value="spin">スピニング</option>
          <option value="bait">ベイト</option>
          <option value="bf">ベイトフィネス</option>
        </select>
        <select id="fRodPower">
          <option>UL</option><option>L</option><option selected>ML</option>
          <option>M</option><option>MH</option><option>H</option><option>XH</option>
        </select>
      </div>
      <button class="btn2" onclick="addRod()">ロッドを追加</button>
    </div>
  </div>
  <div class="card">
    <button class="copybtn" onclick="resetSample()">サンプルデータに戻す(タックルのみ)</button>
    <button class="copybtn" onclick="clearAll()" style="margin-top:8px">タックル全削除</button>
  </div>
</section>
</div>

<div class="go" id="goBar"><button onclick="recommend()">この状況でガイドを見る</button></div>

<script>
/* ============ マスタ ============ */
const CATS = [
 {id:'pencil', label:'ペンシル/ポッパー', group:'top'},
 {id:'buzz', label:'バズベイト', group:'top'},
 {id:'frog', label:'フロッグ', group:'top'},
 {id:'crank_sr', label:'シャロークランク', group:'move'},
 {id:'crank_mr', label:'ミッドクランク', group:'move'},
 {id:'crank_dr', label:'ディープクランク', group:'move'},
 {id:'spinnerbait', label:'スピナーベイト', group:'move'},
 {id:'chatter', label:'チャターベイト', group:'move'},
 {id:'vib', label:'バイブレーション', group:'move'},
 {id:'jerkbait', label:'ミノー/ジャークベイト', group:'move'},
 {id:'shad', label:'シャッド', group:'move'},
 {id:'metal', label:'メタルバイブ', group:'move'},
 {id:'swim', label:'スイムベイト/ビッグベイト', group:'move'},
 {id:'jighead', label:'ジグヘッド+シャッドテール', group:'move'},
 {id:'jig', label:'ラバージグ', group:'bottom'},
 {id:'texas', label:'テキサスリグ', group:'bottom'},
 {id:'nosinker', label:'ノーシンカー(高比重)', group:'bottom'},
 {id:'neko', label:'ネコリグ', group:'fin'},
 {id:'wacky', label:'ジグヘッドワッキー', group:'fin'},
 {id:'downshot', label:'ダウンショット', group:'fin'},
 {id:'smallrubber', label:'スモラバ', group:'fin'},
];
const catById = id => CATS.find(c=>c.id===id);

/* 水温バンド別ベーススコア [<8, 8-12, 12-16, 16-20, 20-26, >26] */
const BASE = {
 pencil:[0,1,3,6,7,6], buzz:[0,0,3,5,7,5], frog:[0,0,2,4,8,9],
 crank_sr:[1,5,7,6,6,4], crank_mr:[3,6,6,5,5,5], crank_dr:[5,5,4,4,6,7],
 spinnerbait:[2,5,8,6,6,5], chatter:[2,6,7,6,6,5], vib:[4,7,6,5,5,5],
 jerkbait:[6,9,7,5,3,2], shad:[6,8,7,6,4,3], metal:[9,5,2,1,2,3],
 swim:[3,5,6,6,5,4], jighead:[5,7,7,6,5,5],
 jig:[5,6,6,5,6,6], texas:[4,5,8,6,7,7], nosinker:[1,3,7,9,8,7],
 neko:[3,6,8,7,7,7], wacky:[2,5,8,8,7,6], downshot:[8,7,7,6,7,8], smallrubber:[7,6,7,7,7,7],
};
const BAND_LABEL = ['真冬パターン','早春・越冬明け','スポーニング(プリ〜産卵)','アフター回復期','初夏〜盛夏','真夏の高水温'];
const MONTH_TEMP = [6,7,10,14,18,22,26,28,26,20,14,9]; // 1-12月の目安水温

const COVERS = {
 reed:{label:'アシ・ブッシュ', where:'アシ際ギリギリ、風や流れが当たる面を優先。切れ目・ポケットが一級スポット'},
 wood:{label:'杭・立木', where:'杭の際、影になる側にタイト。数本まとめてテンポよく撃つ'},
 rock:{label:'岩・リップラップ', where:'岩のブレイク沿いを斜めに通す。時々ボトムに当てるのが◎'},
 bridge:{label:'橋脚', where:'橋脚の明暗と流れのヨレ。アップから通して足元まで気を抜かず'},
 weed:{label:'ウィード', where:'ウィードエッジと切れ目。面より「穴・境目」を狙う'},
 overhang:{label:'オーバーハング', where:'枝の奥のシェードへスキップ気味に。奥に入るほど良い'},
 inflow:{label:'流れ込み', where:'流れの筋と両脇のヨレ。酸素と餌が集まる一等地'},
 pier:{label:'桟橋', where:'支柱まわりと最奥のシェードへスキッピングで送り込む'},
 open:{label:'オープン', where:'沖のブレイク・地形変化を扇状に広くサーチ。回遊待ち'},
 none:{label:'特になし', where:'岸際の変化(影・角・何かある場所)を撃ちながらランガン'},
};

const SKY = {sunny:'快晴', fine:'晴れ', cloud:'曇り', rain:'雨', afterrain:'雨後(増水)'};
const WIND = {calm:'無風', breeze:'そよ風', strong:'強風'};
const TIME = {morning:'朝まずめ', day:'日中', evening:'夕まずめ', night:'夜'};
const CLARITY = {clear:'クリア', stain:'ステイン', muddy:'マッディ'};
const FTYPE = {pond:'野池', lake:'湖・ダム', river:'川'};
const DEPTH = {shallow:'シャロー(〜1.5m)', mid:'ミドル(1.5〜3m)', deep:'ディープ(3m〜)', unknown:'不明'};

const PRESET_FIELDS = [
 {id:'tsukui', name:'津久井湖', type:'lake', lat:35.596, lon:139.262},
 {id:'sagami', name:'相模湖', type:'lake', lat:35.608, lon:139.190},
 {id:'kameyama', name:'亀山湖', type:'lake', lat:35.246, lon:140.080},
 {id:'takataki', name:'高滝湖', type:'lake', lat:35.350, lon:140.130},
 {id:'mishima', name:'三島湖', type:'lake', lat:35.260, lon:140.050},
];

/* ============ 状態 ============ */
const state = {
  month:new Date().getMonth()+1, time:'day', sky:'fine', wind:'breeze',
  clarity:'stain', cover:'none', depth:'unknown',
  fieldId:null, fieldType:'lake', autoTemp:null,
};

const SAMPLE_LURES = [
 {name:'ペンシルベイト 95', cat:'pencil', color:'natural'},
 {name:'バズベイト 3/8oz', cat:'buzz', color:'appeal'},
 {name:'フロッグ', cat:'frog', color:'dark'},
 {name:'シャロークランク SR', cat:'crank_sr', color:'appeal'},
 {name:'ミッドクランク MR', cat:'crank_mr', color:'natural'},
 {name:'スピナーベイト 3/8oz', cat:'spinnerbait', color:'appeal'},
 {name:'チャターベイト 3/8oz', cat:'chatter', color:'dark'},
 {name:'バイブレーション 60', cat:'vib', color:'appeal'},
 {name:'ジャークベイト 100SP', cat:'jerkbait', color:'natural'},
 {name:'シャッド 60SP', cat:'shad', color:'natural'},
 {name:'メタルバイブ 1/4oz', cat:'metal', color:'appeal'},
 {name:'ラバージグ 3/8oz+トレーラー', cat:'jig', color:'dark'},
 {name:'テキサスリグ(ホッグ系)', cat:'texas', color:'dark'},
 {name:'高比重スティックベイト ノーシンカー', cat:'nosinker', color:'natural'},
 {name:'ストレートワーム ネコリグ', cat:'neko', color:'natural'},
 {name:'ジグヘッドワッキー', cat:'wacky', color:'natural'},
 {name:'ダウンショット(シャッドテール)', cat:'downshot', color:'natural'},
 {name:'スモラバ 2.7g', cat:'smallrubber', color:'dark'},
 {name:'ジグヘッド+シャッドテール 3in', cat:'jighead', color:'natural'},
];
const SAMPLE_RODS = [
 {name:'スピニング ML', type:'spin', power:'ML'},
 {name:'ベイト M', type:'bait', power:'M'},
 {name:'ベイト MH', type:'bait', power:'MH'},
];

function load(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){return null} }
function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

let lures = load('bfg_lures') || SAMPLE_LURES.slice();
let rods = load('bfg_rods') || SAMPLE_RODS.slice();
let fields = load('bfg_fields') || PRESET_FIELDS.slice();
let clarMemo = load('bfg_clar') || {};
let isSample = load('bfg_custom') ? false : true;
state.fieldId = load('bfg_lastfield') || (fields[0] ? fields[0].id : 'other');
if(state.fieldId!=='other' && !fields.find(f=>f.id===state.fieldId)) state.fieldId = fields[0]?fields[0].id:'other';

let lastWx = null; // 直近の取得結果

function currentField(){ return fields.find(f=>f.id===state.fieldId) || null; }
function currentFtype(){ const f=currentField(); return f ? f.type : state.fieldType; }

/* ============ UI 構築 ============ */
function chips(elId, opts, key, onPick){
  const el = document.getElementById(elId);
  el.innerHTML='';
  Object.keys(opts).forEach(k=>{
    const b=document.createElement('button');
    b.textContent = typeof opts[k]==='string'?opts[k]:opts[k].label;
    b.onclick=()=>{ state[key]=isNaN(k)?k:+k; chips(elId,opts,key,onPick); if(onPick)onPick(); };
    if(String(state[key])===String(k)) b.classList.add('on');
    el.appendChild(b);
  });
}
function fieldOpts(){
  const o={};
  fields.forEach(f=>o[f.id]=f.name);
  o.other='その他';
  return o;
}
function renderFieldChips(){
  chips('cFieldSel', fieldOpts(), 'fieldId', onFieldChange);
  document.getElementById('genericField').style.display = state.fieldId==='other'?'':'none';
}
function onFieldChange(){
  save('bfg_lastfield', state.fieldId);
  renderFieldChips();
  if(clarMemo[state.fieldId]){ state.clarity=clarMemo[state.fieldId]; chips('cClarity',CLARITY,'clarity'); }
  fetchWx();
}
function buildForm(){
  const months={}; for(let m=1;m<=12;m++) months[m]=m+'月';
  chips('cMonth',months,'month');
  chips('cTime',TIME,'time'); chips('cSky',SKY,'sky'); chips('cWind',WIND,'wind');
  chips('cClarity',CLARITY,'clarity');
  chips('cFieldType',FTYPE,'fieldType');
  renderFieldChips();
  const cov={}; Object.keys(COVERS).forEach(k=>cov[k]=COVERS[k].label);
  chips('cCover',cov,'cover'); chips('cDepth',DEPTH,'depth');
  const sel=document.getElementById('fLureCat');
  sel.innerHTML = CATS.map(c=>`<option value="${c.id}">${c.label}</option>`).join('');

/* ============ 日時の自動設定 ============ */
function autoClock(sunrise, sunset){
  const now=new Date();
  state.month=now.getMonth()+1;
  const h=now.getHours()+now.getMinutes()/60;
  let t;
  if(sunrise!=null && sunset!=null){
    if(h>=sunrise-1 && h<=sunrise+2.5) t='morning';
    else if(h>=sunset-2.5 && h<=sunset+0.5) t='evening';
    else if(h>sunset+0.5 || h<sunrise-1) t='night';
    else t='day';
  }else{
    t = (h>=4&&h<8)?'morning' : (h>=16&&h<19.5)?'evening' : (h>=8&&h<16)?'day' : 'night';
  }
  state.time=t;
  const months={}; for(let m=1;m<=12;m++) months[m]=m+'月';
  chips('cMonth',months,'month'); chips('cTime',TIME,'time');
}

/* ============ 気象自動取得 (Open-Meteo) ============ */
const RAIN_CODES=new Set([51,53,55,56,57,61,63,65,66,67,71,73,75,77,80,81,82,85,86,95,96,99]);
async function fetchWx(force){
  const bar=document.getElementById('wxBar'), data=document.getElementById('wxData'), ttl=document.getElementById('wxTitle');
  const f=currentField();
  autoClock(); // まず端末時計で月・時間帯だけ先に自動設定
  if(!f || f.lat==null || f.lon==null){
    ttl.textContent = f ? f.name : 'フィールド未選択';
    bar.classList.remove('err');
    data.textContent = '座標未登録のため天気の自動取得はオフ。日時のみ自動設定しました。';
    lastWx=null; return;
  }
  ttl.textContent = f.name;
  data.textContent = '取得中…';
  bar.classList.remove('err');
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${f.lat}&longitude=${f.lon}`
    +`&current=temperature_2m,precipitation,weather_code,cloud_cover,wind_speed_10m`
    +`&hourly=temperature_2m,precipitation&daily=sunrise,sunset`
    +`&past_days=2&forecast_days=1&wind_speed_unit=ms&timezone=Asia%2FTokyo`;
  try{
    const res=await fetch(url);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const j=await res.json();
    applyWx(f,j);
  }catch(e){
    bar.classList.add('err');
    data.textContent = '天気を取得できませんでした(電波・またはこのページの制限)。手動で選択してください。日時は自動設定済み。';
    lastWx=null;
  }
}
function applyWx(f,j){
  const cur=j.current;
  const now=new Date();
  // 直近24hの降水量と48hの平均気温
  let rain24=0, tsum=0, tn=0;
  const nowMs=now.getTime();
  j.hourly.time.forEach((t,i)=>{
    const ms=new Date(t).getTime();
    if(ms<=nowMs && ms>nowMs-24*3600e3) rain24+=j.hourly.precipitation[i]||0;
    if(ms<=nowMs && ms>nowMs-48*3600e3){ tsum+=j.hourly.temperature_2m[i]; tn++; }
  });
  // 今日の日の出・日の入り
  const today=now.toISOString().slice(0,10);
  let sr=null, ss=null;
  j.daily.time.forEach((d,i)=>{
    if(j.daily.sunrise[i] && j.daily.sunrise[i].startsWith(today)){
      const p=t=>{const x=new Date(t);return x.getHours()+x.getMinutes()/60;};
      sr=p(j.daily.sunrise[i]); ss=p(j.daily.sunset[i]);
    }
  });
  autoClock(sr,ss);
  // 天気チップ
  const raining=(cur.precipitation||0)>0.2 || RAIN_CODES.has(cur.weather_code);
  if(raining) state.sky='rain';
  else if(rain24>=8) state.sky='afterrain';
  else if(cur.cloud_cover<15) state.sky='sunny';
  else if(cur.cloud_cover<65) state.sky='fine';
  else state.sky='cloud';
  // 風チップ
  const w=cur.wind_speed_10m||0;
  state.wind = w<1.5?'calm' : w<5.5?'breeze' : 'strong';
  chips('cSky',SKY,'sky'); chips('cWind',WIND,'wind');
  // 水温推定: 過去48h平均気温と月別基準のブレンド
  const airMean = tn? tsum/tn : cur.temperature_2m;
  state.autoTemp = Math.min(33, Math.max(1, Math.round(0.6*airMean + 0.4*MONTH_TEMP[state.month-1])));
  document.getElementById('inTemp').placeholder = `推定 ${state.autoTemp}℃(自動)`;
  // サマリー表示
  const skyL=SKY[state.sky];
  const hh=String(now.getHours()).padStart(2,'0'), mm=String(now.getMinutes()).padStart(2,'0');
  document.getElementById('wxData').textContent =
    `${now.getMonth()+1}/${now.getDate()} ${hh}:${mm} 自動取得 | 気温${cur.temperature_2m}℃ / ${skyL}(雲量${cur.cloud_cover}%) / 風${w}m/s / 24h降水${Math.round(rain24*10)/10}mm / 推定水温${state.autoTemp}℃`;
  lastWx={air:cur.temperature_2m, wind:w, rain24:Math.round(rain24*10)/10};
}

/* ============ 推奨エンジン ============ */
function tempBand(t){ return t<8?0 : t<12?1 : t<16?2 : t<20?3 : t<26?4 : 5; }

function scoreAll(ctx){
  const scores={};
  CATS.forEach(c=>{ scores[c.id] = BASE[c.id][ctx.band]; });
  const add=(ids,v)=>ids.forEach(id=>{ if(id in scores) scores[id]+=v; });

  // 秋は巻きの季節
  if(ctx.month>=9 && ctx.month<=11) add(['crank_sr','crank_mr','crank_dr','spinnerbait','vib','chatter','metal','jighead'],2);

  // 時間帯
  if(ctx.time==='morning'||ctx.time==='evening'){
    add(['pencil','buzz','frog'],2); add(['spinnerbait','chatter','crank_sr','crank_mr','vib','jerkbait','jighead'],1);
  }
  if(ctx.time==='day' && (ctx.sky==='sunny'||ctx.sky==='fine')){
    add(['pencil','buzz'],-2); add(['frog'],1);
    add(['downshot','neko','smallrubber','wacky','texas','jig','nosinker'],1);
  }
  if(ctx.time==='night'){ add(['jig','texas','spinnerbait','pencil'],1); add(['downshot','smallrubber','jerkbait','shad'],-1); }

  // 天気
  if(ctx.sky==='cloud'){ add(['pencil','buzz','spinnerbait','chatter','crank_sr','crank_mr'],1); }
  if(ctx.sky==='rain'){ add(['pencil','buzz','spinnerbait','chatter'],2); add(['frog'],1); }
  if(ctx.sky==='afterrain'){ add(['spinnerbait','chatter','texas','jig','crank_sr'],2); add(['downshot','neko','wacky','smallrubber','jerkbait'],-2); }
  if(ctx.sky==='sunny'){ add(['downshot','neko','smallrubber','nosinker'],1); }

  // 風
  if(ctx.wind==='calm'){ add(['pencil','nosinker','neko','downshot','wacky','smallrubber'],1); }
  if(ctx.wind==='breeze'){ add(['spinnerbait','chatter','crank_sr','crank_mr','vib','jighead'],1); }
  if(ctx.wind==='strong'){
    add(['spinnerbait','chatter','vib'],2); add(['metal','crank_mr','crank_dr'],1);
    add(['pencil','frog'],-2); add(['downshot','neko','wacky','smallrubber','nosinker'],-2);
  }

  // 水質
  if(ctx.clarity==='clear'){ add(['jerkbait','nosinker','neko','downshot','wacky','shad'],1); add(['spinnerbait','chatter','vib'],-1); }
  if(ctx.clarity==='stain'){ add(['spinnerbait','chatter'],1); }
  if(ctx.clarity==='muddy'){
    add(['spinnerbait','chatter','vib','jig','texas','crank_sr'],2);
    add(['neko','downshot','smallrubber','wacky'],-2); add(['jerkbait','shad'],-2); add(['nosinker'],-1);
  }

  // 水深
  if(ctx.depth==='shallow'){ add(['crank_dr'],-4); add(['metal'],-2); }
  if(ctx.depth==='mid'){ add(['crank_mr'],1); }
  if(ctx.depth==='deep'){
    add(['crank_dr','metal'],2); add(['downshot','jig'],1);
    add(['frog','buzz'],-3); add(['pencil'],-2); add(['crank_sr'],-2);
  }

  // カバー
  const cv=ctx.cover;
  if(cv==='reed'||cv==='overhang'){
    add(['frog','texas','nosinker'],2); add(['jig','smallrubber','spinnerbait'],1);
    add(['vib','metal'],-2); add(['crank_mr','crank_dr','jerkbait','downshot'],-1);
  }
  if(cv==='weed'){ add(['frog','nosinker'],2); add(['neko','texas','spinnerbait','chatter'],1); add(['vib','crank_dr','metal'],-2); }
  if(cv==='wood'){ add(['texas','jig','spinnerbait','wacky','neko','crank_sr'],1); }
  if(cv==='rock'){ add(['jig'],2); add(['crank_sr','crank_mr','crank_dr','texas','vib','metal'],1); }
  if(cv==='bridge'){ add(['vib','metal','downshot','wacky','jerkbait','swim'],1); }
  if(cv==='inflow'){ add(['nosinker','shad','jerkbait','spinnerbait','pencil','jighead'],1); }
  if(cv==='open'){ add(['vib','metal','spinnerbait','crank_mr','crank_dr','swim','jighead'],1); add(['frog'],-2); add(['smallrubber'],-1); }
  if(cv==='pier'){ add(['smallrubber','wacky'],2); add(['downshot','neko','nosinker','frog'],1); add(['crank_mr','crank_dr'],-1); }

  // フィールドタイプ
  if(ctx.ftype==='lake'){ add(['crank_dr','downshot','metal','jighead','swim'],1); }
  if(ctx.ftype==='river'){ add(['spinnerbait','crank_sr','nosinker','chatter'],1); }

  return scores;
}

function bestColor(ctx){
  if(ctx.clarity==='muddy'||ctx.time==='night') return {key:'dark', label:'ブラック/チャート系の強い存在感'};
  if(ctx.clarity==='clear'&&(ctx.sky==='sunny'||ctx.sky==='fine')) return {key:'natural', label:'ナチュラル系(グリパン/ウォーターメロン/クリア)'};
  if(ctx.sky==='rain'||ctx.sky==='afterrain'||ctx.sky==='cloud') return {key:'appeal', label:'アピール系(チャート/ホワイト/ゴールド)'};
  return {key:'natural', label:'ナチュラル系ベース'};
}
function rodFor(id){
  const g=catById(id).group;
  let want;
  if(id==='frog'||id==='swim') want={type:'bait',powers:['H','XH','MH']};
  else if(g==='bottom'||id==='chatter'||id==='spinnerbait'||id==='buzz') want={type:'bait',powers:['MH','M','H']};
  else if(g==='move') want={type:'bait',powers:['M','MH','ML']};
  else if(id==='smallrubber') want={type:'bf',powers:['L','ML'],alt:'spin'};
  else want={type:'spin',powers:['L','ML','UL']};
  let r = rods.find(x=>x.type===want.type && want.powers.includes(x.power))
       || rods.find(x=>x.type===want.type)
       || (want.alt ? rods.find(x=>x.type===want.alt) : null);
  return r ? r.name : null;
}

function recommend(){
  const el=document.getElementById('results');
  if(!lures.length){
    el.innerHTML='<div class="card empty">ルアーが未登録です。「タックル」タブで追加してください。</div>';
    el.scrollIntoView({behavior:'smooth'}); return;
  }
  const tIn=parseFloat(document.getElementById('inTemp').value);
  const temp = !isNaN(tIn) ? tIn : (state.autoTemp!=null ? state.autoTemp : MONTH_TEMP[state.month-1]);
  const tempSrc = !isNaN(tIn) ? '実測' : (state.autoTemp!=null ? '気温から推定' : '月から推定');
  const ftype=currentFtype();
  const ctx={...state, temp, band:tempBand(temp), ftype};
  const scores=scoreAll(ctx);

  // 水質をフィールドごとに記憶
  clarMemo[state.fieldId]=state.clarity; save('bfg_clar',clarMemo);

  // 手持ちにあるカテゴリのみ
  const owned=[...new Set(lures.map(l=>l.cat))];
  let ranked=owned.map(id=>({id, s:scores[id]??0, g:catById(id).group})).sort((a,b)=>b.s-a.s);

  // グループを分散して上位3つ
  const picks=[]; const usedG=new Set();
  for(const r of ranked){ if(picks.length<3 && !usedG.has(r.g)){ picks.push(r); usedG.add(r.g); } }
  for(const r of ranked){ if(picks.length<3 && !picks.includes(r)) picks.push(r); }

  const color=bestColor(ctx);
  const maxS=Math.max(...ranked.map(r=>r.s), 1);

  // 戦略メモ
  const f=currentField();
  const cover=COVERS[ctx.cover];
  let memo=`<b>${f?esc(f.name):FTYPE[ftype]} / ${BAND_LABEL[ctx.band]}</b>(水温${temp}℃・${tempSrc})。`;
  memo+=`${SKY[ctx.sky]}・${WIND[ctx.wind]}・${TIME[ctx.time]}なら、`;
  if(ctx.band<=1) memo+='動きは最小限に。ゆっくり見せてリアクションかフォールで食わせる展開。';
  else if(ctx.band===2) memo+='シャローに差してくる魚を意識。カバー周りを丁寧に、テンポと食わせを使い分ける。';
  else if(ctx.band===3) memo+='回復系はフォールと水面に反応が良い。ゆっくり漂わせる展開が軸。';
  else if(ctx.month>=9&&ctx.month<=11) memo+='ベイトを追って散る秋。巻きもので広くサーチして魚を探すのが最優先。';
  else memo+='シェード・流れ・風の当たる面など「快適な場所」に魚が集中。一等地を撃ち抜く。';
  if(lastWx && lastWx.rain24>=8 && state.sky!=='rain') memo+=` 直近24hで${lastWx.rain24}mmの雨。濁りと増水を前提に。`;

  let html=`<div class="strategy">${memo}</div>`;
  picks.forEach((p,idx)=>{
    const cat=catById(p.id);
    const inCat=lures.filter(l=>l.cat===p.id);
    const lure=inCat.find(l=>l.color===color.key)||inCat[0];
    const rod=rodFor(p.id);
    const pct=Math.round(p.s/maxS*100);
    html+=`<div class="card rec">
      <div class="head"><span class="rank">${idx+1}</span>
        <div><div class="name">${esc(lure.name)}</div><div class="cat">${cat.label}</div></div></div>
      <div class="fit"><div class="bar"><i style="width:${pct}%"></i></div><span>適合度 ${pct}</span></div>
      <dl class="kv">
        <dt>どこに</dt><dd>${cover.where}</dd>
        <dt>レンジ</dt><dd>${rangeText(p.id,ctx)}</dd>
        <dt>動かし方</dt><dd>${speedText(p.id,ctx)}</dd>
        <dt>カラー</dt><dd>${color.label}</dd>
      </dl>
      ${rod?`<div class="tacklehint">推奨タックル: ${esc(rod)}</div>`:''}
      <div class="reason">${groupReason(p.g,ctx)}</div>
    </div>`;
  });

  // チャット相談用コピー
  const now=new Date();
  const condText=`【バス釣り状況】${f?f.name:FTYPE[ftype]} ${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')} ${TIME[ctx.time]}/${SKY[ctx.sky]}/${WIND[ctx.wind]}/水温${temp}℃(${tempSrc})${lastWx?`/気温${lastWx.air}℃/風速${lastWx.wind}m/s/24h降水${lastWx.rain24}mm`:''}/${CLARITY[ctx.clarity]}/ポイント:${cover.label}/狙い:${DEPTH[ctx.depth]}。この状況で反応が出ません。次の一手を教えて。`;
  html+=`<button class="copybtn" onclick="copyCond(this)" data-t="${esc(condText)}">状況をコピーしてClaudeに相談する文面を作る</button>`;

  el.innerHTML=html;
  el.scrollIntoView({behavior:'smooth'});
}
function copyCond(btn){
  const t=btn.getAttribute('data-t');
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(
    ()=>{btn.textContent='コピーしました。Claudeアプリに貼り付けて相談してください';},
    ()=>{prompt('コピーしてください', t);}
  );
}

buildForm();
fetchWx();
</script>
